<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" fill="none">
  <g transform="translate(35, 6)">
    <!-- Left heart curve going up to peak -->
    <path d="M28 58 C12 44, -4 30, -4 18 C-4 8, 4 0, 14 0 C20 0, 25 3, 28 8" 
          stroke="#C41E3A" stroke-width="4.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right heart curve going up to peak -->
    <path d="M28 58 C44 44, 60 30, 60 18 C60 8, 52 0, 42 0 C36 0, 31 3, 28 8" 
          stroke="#C41E3A" stroke-width="4.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left tube curving down to chest piece -->
    <path d="M-4 18 C-6 26, -12 34, -14 42" 
          stroke="#C41E3A" stroke-width="4.8" fill="none" stroke-linecap="round"/>
    <!-- Chest piece (larger circle with dot) -->
    <circle cx="-14" cy="50" r="8" stroke="#C41E3A" stroke-width="3.8" fill="none"/>
    <circle cx="-14" cy="50" r="2.5" fill="#C41E3A"/>
    
    <!-- Right tube curving down to ear piece -->
    <path d="M60 18 C62 26, 66 34, 68 42" 
          stroke="#C41E3A" stroke-width="4.8" fill="none" stroke-linecap="round"/>
    <!-- Ear piece (smaller circle) -->
    <circle cx="68" cy="48" r="4.5" stroke="#C41E3A" stroke-width="3.5" fill="none"/>
  </g>
  
  <!-- Vertical divider -->
  <line x1="115" y1="14" x2="115" y2="66" stroke="#374151" stroke-width="1.2"/>
  
  <!-- e-Vitals text -->
  <text x="128" y="42" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="800" fill="#1f2937" letter-spacing="-1.2">
    e-Vitals
  </text>
  
  <!-- Remote Patient Monitoring subtitle -->
  <text x="128" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#6b7280" letter-spacing="0.3">
    Remote Patient Monitoring
  </text>
</svg>
